# Standalone Apache config for LOCAL DEVELOPMENT only.
#
# Why this exists:
#   `symfony serve` (and the PHP built-in server) serve existing files under
#   public/ statically, bypassing PHP and the nelmio-cors listener. That means
#   /images/*.webp are returned WITHOUT CORS headers, so html2canvas (useCORS)
#   cannot draw them onto a readable canvas. Apache reads public/.htaccess, where
#   a `Header set Access-Control-Allow-Origin "*"` rule is applied to images even
#   when served statically — matching production behaviour.
#
# Run it (no root needed, listens on 8000, runs as the current user):
#   ./dev/serve-apache.sh
# then point the Angular app's API base URL at http://localhost:8000 as usual.

ServerName localhost
Listen ${APACHE_DEV_PORT}
PidFile ${APACHE_DEV_RUN}/httpd.pid

# --- modules (unixd / log_config / mpm / core are compiled-in statically) ---
LoadModule mpm_prefork_module /usr/lib/apache2/modules/mod_mpm_prefork.so
LoadModule authz_core_module  /usr/lib/apache2/modules/mod_authz_core.so
LoadModule dir_module         /usr/lib/apache2/modules/mod_dir.so
LoadModule mime_module        /usr/lib/apache2/modules/mod_mime.so
LoadModule rewrite_module     /usr/lib/apache2/modules/mod_rewrite.so
LoadModule headers_module     /usr/lib/apache2/modules/mod_headers.so
LoadModule php_module         /usr/lib/apache2/modules/libphp8.5.so

# Run as the current user (set via APACHE_DEV_USER/GROUP by the launch script)
User ${APACHE_DEV_USER}
Group ${APACHE_DEV_GROUP}

TypesConfig /etc/mime.types
AddType application/x-httpd-php .php
DirectoryIndex index.php

ErrorLog ${APACHE_DEV_RUN}/error.log
# Keep logs quiet; raise to "info" when debugging.
LogLevel warn

DocumentRoot "${APACHE_DEV_DOCROOT}"
<Directory "${APACHE_DEV_DOCROOT}">
    Options FollowSymLinks
    AllowOverride All
    Require all granted
</Directory>
